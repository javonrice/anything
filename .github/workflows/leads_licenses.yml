name: Lead Scraper — State Licenses

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes (leave blank for all)"
        required: false
        default: ""
      category:
        description: "Filter by category: real_estate or insurance (leave blank for both)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas openpyxl beautifulsoup4 lxml

      - name: Run scraper
        working-directory: lead_scraper
        run: |
          python run.py \
            --states "${{ github.event.inputs.states }}" \
            --category "${{ github.event.inputs.category }}"

      - name: Show row counts
        working-directory: lead_scraper
        run: |
          echo "=== Parsed files ==="
          wc -l parsed_data/*.csv 2>/dev/null || echo "No parsed files"
          echo ""
          echo "=== Master file ==="
          wc -l leads_master.csv 2>/dev/null || echo "leads_master.csv not found"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leads-${{ github.run_number }}
          path: |
            lead_scraper/leads_master.csv
            lead_scraper/parsed_data/
          if-no-files-found: warn
