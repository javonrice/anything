name: Watch Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        default: "https://youtu.be/y_bsjZThP0o?is=DdliC-yS2dEJ5a7B"
      question:
        description: "What do you want to know about the video?"
        required: false
        default: "Summarize this video."

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install yt-dlp requests

      - name: Clone claude-video
        run: git clone https://github.com/bradautomates/claude-video.git

      - name: Install skill Python requirements
        run: |
          REQ=claude-video/skills/watch/scripts/requirements.txt
          [ -f "$REQ" ] && pip install -r "$REQ" || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Process video and ask Claude
        run: |
          mkdir -p workspace
          # Run watch.py — it outputs a markdown report to stdout
          python claude-video/skills/watch/scripts/watch.py \
            "${{ github.event.inputs.video_url }}" \
            --out-dir workspace \
            --no-whisper \
            > workspace/report.md 2>workspace/errors.log || true

          echo "=== watch.py output ==="
          cat workspace/report.md

          echo "=== Sending to Claude ==="
          REPORT=$(cat workspace/report.md)
          QUESTION="${{ github.event.inputs.question }}"

          claude -p "$(printf 'Here is a video report (frames + transcript):\n\n%s\n\n---\n\nQuestion: %s' "$REPORT" "$QUESTION")"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
