name: Watch Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        default: "https://youtu.be/y_bsjZThP0o?is=DdliC-yS2dEJ5a7B"
      question:
        description: "What do you want to know about the video?"
        required: false
        default: "Summarize this video."

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install yt-dlp requests

      - name: Clone claude-video
        run: git clone https://github.com/bradautomates/claude-video.git

      - name: Install skill Python requirements
        run: |
          REQ=claude-video/skills/watch/scripts/requirements.txt
          [ -f "$REQ" ] && pip install -r "$REQ" || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Process video and ask Claude
        run: |
          mkdir -p workspace

          # Run watch.py — capture both stdout and stderr, show all output
          python claude-video/skills/watch/scripts/watch.py \
            "${{ github.event.inputs.video_url }}" \
            --out-dir workspace \
            --no-whisper 2>&1 | tee workspace/watch_output.txt || true

          echo "=== workspace files ==="
          ls -la workspace/

          echo "=== watch output ==="
          cat workspace/watch_output.txt

          # Find transcript — could be .txt, .vtt, .srt, or inside watch_output
          TRANSCRIPT=""
          for f in workspace/*.txt workspace/*.vtt workspace/*.srt workspace/transcript*; do
            [ -f "$f" ] && [ "$f" != "workspace/watch_output.txt" ] && TRANSCRIPT=$(cat "$f") && break
          done

          # Fallback: use the full watch output if no separate transcript
          if [ -z "$TRANSCRIPT" ]; then
            TRANSCRIPT=$(cat workspace/watch_output.txt)
          fi

          QUESTION="${{ github.event.inputs.question }}"
          echo "=== Sending to Claude ==="
          claude -p "$(printf 'Video transcript/report:\n\n%s\n\n---\n\nQuestion: %s' "$TRANSCRIPT" "$QUESTION")"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
