name: Watch Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        default: "https://youtu.be/y_bsjZThP0o?is=DdliC-yS2dEJ5a7B"

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install watch skill
        run: npx skills add bradautomates/claude-video -g

      - name: Run watch skill
        run: claude -p "/watch ${{ github.event.inputs.video_url }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
