name: Watch Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        default: "https://youtu.be/y_bsjZThP0o?is=DdliC-yS2dEJ5a7B"
      question:
        description: "What do you want to know about the video?"
        required: false
        default: "Summarize this video."

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install "yt-dlp>=2024.11.18" requests bgutil-ytdlp-pot-provider

      - name: Install bgutil Node.js server dependencies
        run: |
          SERVER_HOME=$(python3 -c "
import importlib.util, os
spec = importlib.util.find_spec('bgutil_ytdlp_pot_provider')
print(os.path.join(os.path.dirname(spec.origin), 'server'))
")
          echo "SERVER_HOME=$SERVER_HOME" >> $GITHUB_ENV
          echo "Server home: $SERVER_HOME"
          ls "$SERVER_HOME" || true
          cd "$SERVER_HOME" && npm install 2>&1 | tail -5

      - name: Clone claude-video
        run: git clone https://github.com/bradautomates/claude-video.git

      - name: Install skill Python requirements
        run: |
          REQ=claude-video/skills/watch/scripts/requirements.txt
          [ -f "$REQ" ] && pip install -r "$REQ" || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Download video
        run: |
          mkdir -p workspace/download

          VIDEO_URL="${{ github.event.inputs.video_url }}"

          echo "=== Downloading with bgutil PO token provider ==="
          yt-dlp \
            --extractor-args "youtubepot-bgutilscript:server_home=$SERVER_HOME" \
            --format "bestvideo[ext=mp4][height<=720]+bestaudio[ext=m4a]/best[ext=mp4][height<=720]/best" \
            -o "workspace/download/video.%(ext)s" \
            "$VIDEO_URL" 2>&1 | tee workspace/download_output.txt || true

          echo "=== Download directory ==="
          ls -la workspace/download/

          VIDEO_FILE=$(ls workspace/download/video.* 2>/dev/null | grep -v "\.txt" | head -1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "ERROR: Download failed. Output:"
            cat workspace/download_output.txt
            exit 1
          fi
          echo "Downloaded: $VIDEO_FILE"

      - name: Process video and ask Claude
        run: |
          VIDEO_FILE=$(ls workspace/download/video.* 2>/dev/null | grep -v "\.txt" | head -1)

          echo "=== Running watch.py on $VIDEO_FILE ==="
          python claude-video/skills/watch/scripts/watch.py \
            "$VIDEO_FILE" \
            --out-dir workspace \
            --no-whisper 2>&1 | tee workspace/watch_output.txt || true

          echo "=== workspace files ==="
          ls -la workspace/

          echo "=== watch output ==="
          cat workspace/watch_output.txt

          TRANSCRIPT=""
          for f in workspace/*.txt workspace/*.vtt workspace/*.srt workspace/transcript* workspace/report*; do
            [ -f "$f" ] && [ "$f" != "workspace/watch_output.txt" ] && TRANSCRIPT=$(cat "$f") && break
          done

          if [ -z "$TRANSCRIPT" ]; then
            TRANSCRIPT=$(cat workspace/watch_output.txt)
          fi

          QUESTION="${{ github.event.inputs.question }}"
          echo "=== Sending to Claude ==="
          claude -p "$(printf 'Video analysis report:\n\n%s\n\n---\n\nQuestion: %s' "$TRANSCRIPT" "$QUESTION")"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
