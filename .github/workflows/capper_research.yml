name: Capper Research

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python capper_research.py

      - uses: actions/upload-artifact@v4
        with:
          name: capper-research
          path: |
            capper_profiles_*.csv
            capper_tweets_*.csv
          if-no-files-found: error
