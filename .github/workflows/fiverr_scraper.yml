name: Fiverr Demand Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python fiverr_scraper.py
          echo "Exit code: $?"
          wc -l fiverr_demand.csv || true

      - uses: actions/upload-artifact@v4
        with:
          name: fiverr-demand
          path: fiverr_demand.csv
          if-no-files-found: error
